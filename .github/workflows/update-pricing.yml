name: Update EC2 Pricing Data

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./ec2prices/source

      # Writes ec2prices/data/ only when prices or specs actually changed.
      - name: Update pricing data
        run: python3 data.py
        working-directory: ./ec2prices/source

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # One branch for all runs: an open PR is updated in place instead of a new one each week.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          commit-message: "pricing data updated"
          title: "🤖 Pricing data update - ${{ steps.date.outputs.date }}"
          body: "Updated AWS EC2 Linux on-demand prices and instance specs in `ec2prices/data/`. Only regions whose prices changed are touched."
          branch: pricing-update
          delete-branch: true
          assignees: mrlikl
          add-paths: |
            ec2prices/data/

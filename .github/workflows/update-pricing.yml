name: Update EC2 Pricing Data

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./ec2prices/source

      - name: Update pricing data
        run: |
          python3 data.py
          python3 generate_static.py
        working-directory: ./ec2prices/source

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "pricing data updated"
          title: "🤖 Pricing data update - ${{ steps.date.outputs.date }}"
          body: "This PR contains updated AWS EC2 Linux On-Demand pricing data and regenerated static HTML."
          branch: pricing-update-${{ github.run_number }}
          assignees: mrlikl
          add-paths: |
            ec2prices/

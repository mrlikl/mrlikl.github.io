name: Update CloudFormation Schemas

on:
  schedule:
    - cron: "0 1 * * 0" # Weekly on Sunday at 1 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      # Rewrites only schemas that changed and removes ones AWS no longer publishes.
      # SAM rules in cfn2iam/backend/sam_rules/ are maintained by hand and not touched.
      - name: Update schemas
        run: python3 process_schemas.py
        working-directory: ./cfn2iam/backend

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # One branch for all runs: an open PR is updated in place instead of a new one each week.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          commit-message: "cfn schemas updated"
          title: "🤖 CFN Schema update - ${{ steps.date.outputs.date }}"
          body: "Updated CloudFormation resource schemas in `cfn2iam/backend/schemas/`."
          branch: schema-update
          delete-branch: true
          assignees: mrlikl
          add-paths: |
            cfn2iam/backend/schemas/

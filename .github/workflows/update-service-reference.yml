name: Update Service Authorization Reference

on:
  schedule:
    - cron: "0 1 * * 0" # Weekly on Sunday at 1 AM UTC, alongside the schema update
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-service-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      # All or nothing: a fetch failure or a malformed file fails this step and no PR is opened.
      # The log ends with how many schema actions resolve in the reference; it becomes the PR body.
      - name: Update service reference
        shell: bash
        run: |
          {
            echo 'Updated the AWS Service Authorization Reference in `cfn2iam/backend/servicereference/`.'
            echo
            echo '```'
            python3 process_service_reference.py
            echo '```'
          } | tee "$RUNNER_TEMP/pr-body.md"
        working-directory: ./cfn2iam/backend

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Own branch, separate from schema-update, so either update can merge or fail alone.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "service reference updated"
          title: "🤖 Service Authorization Reference update - ${{ steps.date.outputs.date }}"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: service-reference-update
          delete-branch: true
          assignees: mrlikl
          add-paths: |
            cfn2iam/backend/servicereference/

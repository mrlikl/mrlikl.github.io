version: 2

# Weekly, grouped into one pull request per ecosystem, skipping releases younger than a week,
# except the cfn2iam pin at the end.
updates:
  # Actions are pinned by commit SHA with the version in a comment; Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/ec2prices/source"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # The cfn2iam release the web tool runs (cfn2iam/requirements.txt, version and hashes).
  # Daily with no cooldown and no group, so a new release gets its own "Bump cfn2iam" PR
  # within a day; merging it is what changes the page.
  - package-ecosystem: "pip"
    directory: "/cfn2iam"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "cfn2iam"
